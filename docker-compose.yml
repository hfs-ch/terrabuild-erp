services:

  app:
    build: .
    container_name: terrabuild_app
    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - .:/var/www/html

    depends_on:
      - mysql

    environment:
      APP_ENV: local
      APP_DEBUG: "true"

    networks:
      - terrabuild

  mysql:
    image: mysql:8.0
    container_name: terrabuild_mysql
    restart: unless-stopped

    ports:
      - "33307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: terrabuild
      MYSQL_USER: terrabuild
      MYSQL_PASSWORD: secret

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - terrabuild

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: terrabuild_phpmyadmin
    restart: unless-stopped

    ports:
      - "8080:80"

    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root

    depends_on:
      - mysql

    networks:
      - terrabuild

volumes:
  mysql_data:

networks:
  terrabuild: